name: Deploy DICOM3D research demo
# Manual only: merging or pushing source does not authorize a public deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/alpha/three-prototype/package-lock.json
      - name: Install locked Three/R3F dependencies
        run: npm ci --prefix prototypes/alpha/three-prototype
      - name: Build and verify expanded public alpha
        working-directory: prototypes/alpha/three-prototype
        run: node build-public-review.mjs ../review-dist
      - name: Verify static demo identity
        run: |
          test -s prototypes/alpha/review-dist/index.html
          test -s prototypes/alpha/review-dist/atlas/index.json
          test -s prototypes/alpha/review-dist/female-delta/female-reproductive-delta.glb
          test -s prototypes/alpha/review-dist/demo/h000/NOTICE.md
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/alpha/review-dist
      - uses: actions/deploy-pages@v4
        id: deployment
