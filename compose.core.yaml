name: dicom3d-core
services:
  core:
    image: dicom3d-core:0.6.5
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "127.0.0.1:${DICOM3D_CORE_PORT:-53042}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 64
    restart: "no"
    stop_grace_period: 10s
