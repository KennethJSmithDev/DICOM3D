<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <title>DICOM3D</title>
  </head>
  <body>
    <header>
      <div><h1>DICOM3D</h1><p class="intro">Research development viewer · presentation only</p></div>
      <div class="files">
        <label for="manifestFile">Manifest</label><input id="manifestFile" type="file" accept="application/json,.json" />
        <label for="glbFile">GLB</label><input id="glbFile" type="file" accept="model/gltf-binary,.glb" />
      </div>
      <div class="controls" aria-label="Structure controls">
        <button id="visibilityButton" type="button" disabled>Hide structure</button>
        <button id="clearButton" type="button" disabled>Clear selection</button>
      </div>
    </header>
    <canvas id="renderCanvas" aria-label="3D structure presentation"></canvas>
    <pre id="status" role="status" aria-live="polite">Choose a manifest and its matching GLB. No example medical data is bundled.</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
